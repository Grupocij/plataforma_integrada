<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suporte Técnico Mobile - Grupo CIJ</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; color: #0f172a; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        
        /* Efeito de piscar para o botão de urgência */
        .pulse-urgencia { animation: pulseRed 2s infinite; }
        @keyframes pulseRed {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-3 sm:p-6">

    <!-- DATALISTS PARA O AUTOCOMPLETE DA CENTRAL DE CADASTROS -->
    <datalist id="clientes-oficiais"></datalist>
    <datalist id="maquinas-oficiais"></datalist>

    <!-- CONTAINER PRINCIPAL DO MÓDULO -->
    <div id="main-content" class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden flex flex-col my-auto hidden">
        
        <!-- CABEÇALHO MOBILE -->
        <div class="bg-gradient-to-r from-blue-900 to-blue-700 text-white p-5 text-center relative">
            <span class="absolute left-4 top-5 text-xs font-bold bg-blue-800/60 px-2.5 py-1 rounded-full border border-blue-400/30">
                <i class="fa-solid fa-headset mr-1"></i> Suporte WhatsApp
            </span>
            <h1 class="text-lg font-black tracking-tight mt-6">Atendimento Remoto OSR</h1>
            <p class="text-[11px] text-blue-200 mt-0.5">Grupo CIJ — Registro de Suporte Técnico</p>
        </div>

        <!-- FORMULÁRIO DE PREENCHIMENTO -->
        <form id="formSuporteMobile" onsubmit="event.preventDefault();" class="p-5 space-y-4 flex-1 custom-scrollbar">
            
            <!-- Nº OSR -->
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Nº OSR (Gerado Auto)</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400"><i class="fa-solid fa-hashtag text-xs"></i></span>
                    <input type="text" id="osr_numero" readonly placeholder="Gerado ao Salvar" class="w-full pl-9 pr-3.5 py-2.5 bg-blue-50/70 border border-blue-200 rounded-2xl text-xs font-black text-blue-950 outline-none cursor-not-allowed text-center">
                </div>
            </div>

            <!-- Técnico Responsável -->
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Técnico Responsável *</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400"><i class="fa-solid fa-user-gear text-xs"></i></span>
                    <input type="text" id="osr_tecnico" required readonly class="w-full pl-9 pr-3.5 py-2.5 bg-slate-100 border border-slate-300 rounded-2xl text-xs font-bold text-slate-600 outline-none cursor-not-allowed">
                </div>
            </div>

            <!-- Cliente -->
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Cliente *</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400"><i class="fa-solid fa-building text-xs"></i></span>
                    <input type="text" id="osr_cliente" list="clientes-oficiais" required oninput="window.buscarClientesSemelhantesEFiltrarMaquinas(this.value)" placeholder="Digite o nome da empresa..." class="w-full pl-9 pr-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-2xl text-xs font-medium text-slate-900 outline-none focus:border-blue-600 transition">
                </div>
                <!-- ALERTA DE CLIENTES SEMELHANTES -->
                <div id="alertaClientesSimilares" class="hidden mt-2 p-3 bg-amber-50 border border-amber-300 rounded-2xl space-y-2 shadow-xs">
                    <div class="flex items-center justify-between text-xs font-bold text-amber-900">
                        <span><i class="fa-solid fa-triangle-exclamation text-amber-600 mr-1"></i> Histórico anterior deste cliente:</span>
                    </div>
                    <div id="listaClientesSimilares" class="space-y-1.5 max-h-36 overflow-y-auto custom-scrollbar"></div>
                </div>
            </div>

            <!-- Contato -->
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Contato (WhatsApp / Nome) *</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400"><i class="fa-solid fa-user-tie text-xs"></i></span>
                    <input type="text" id="osr_contato" required placeholder="Nome e telefone do responsável" class="w-full pl-9 pr-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-2xl text-xs font-medium text-slate-900 outline-none focus:border-blue-600 transition">
                </div>
            </div>

            <!-- Endereço do Cliente -->
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Endereço do Cliente</label>
                <div class="relative">
                    <span class="absolute top-3 left-0 pl-3.5 flex items-center text-slate-400"><i class="fa-solid fa-location-dot text-xs"></i></span>
                    <textarea id="osr_endereco" readonly rows="2" placeholder="Preenchido pelo cadastro oficial" class="w-full pl-9 pr-3.5 py-2.5 bg-slate-100 border border-slate-300 rounded-2xl text-xs font-medium text-slate-600 outline-none resize-none"></textarea>
                </div>
            </div>

            <!-- MÁQUINA E SERIAL LADO A LADO -->
            <div class="grid grid-cols-2 gap-3">
                <div class="col-span-2 sm:col-span-1">
                    <label class="block text-[11px] font-bold text-slate-700 uppercase mb-1">Máquina / Modelo *</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400"><i class="fa-solid fa-print text-xs"></i></span>
                        <input type="text" id="osr_maquina" list="maquinas-oficiais" required onchange="window.extrairSerialMobile(this.value)" placeholder="Digite livre ou selecione..." class="w-full pl-8 pr-2 py-2.5 bg-slate-50 border border-slate-300 rounded-2xl text-[11px] font-bold text-slate-900 outline-none focus:border-blue-600 transition">
                    </div>
                </div>
                <div class="col-span-2 sm:col-span-1">
                    <label class="block text-[11px] font-bold text-slate-700 uppercase mb-1">Nº Série (Opcional)</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400"><i class="fa-solid fa-barcode text-xs"></i></span>
                        <input type="text" id="osr_serial" placeholder="SN..." class="w-full pl-8 pr-2 py-2.5 bg-slate-50 border border-slate-300 rounded-2xl text-[11px] font-bold text-slate-900 outline-none focus:border-blue-600 transition">
                    </div>
                </div>
            </div>

            <!-- Defeito Relatado -->
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Defeito Relatado *</label>
                <textarea id="osr_defeito" required rows="2" placeholder="Descreva o problema informado pelo cliente..." class="w-full p-3 bg-slate-50 border border-slate-300 rounded-2xl text-xs font-medium text-slate-900 outline-none focus:border-blue-600 transition resize-none"></textarea>
            </div>

            <!-- Parecer Técnico -->
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Parecer Técnico *</label>
                <textarea id="osr_solucao" required rows="2" placeholder="Parecer e procedimento realizado pelo técnico..." class="w-full p-3 bg-slate-50 border border-slate-300 rounded-2xl text-xs font-medium text-slate-900 outline-none focus:border-blue-600 transition resize-none"></textarea>
            </div>

            <!-- Peças Necessárias -->
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Peças Necessárias / Utilizadas (Opcional)</label>
                <textarea id="osr_pecas" rows="2" placeholder="Ex: Filtro principal..." class="w-full p-3 bg-slate-50 border border-slate-300 rounded-2xl text-xs font-medium text-slate-900 outline-none focus:border-blue-600 transition resize-none"></textarea>
            </div>

            <!-- FOTO DO DEFEITO / EQUIPAMENTO -->
            <div class="bg-slate-50 p-3 rounded-2xl border border-slate-200 border-dashed">
                <label class="block text-xs font-bold text-slate-700 uppercase mb-2"><i class="fa-solid fa-camera text-slate-500 mr-1"></i> Anexar Foto (Opcional)</label>
                <input type="file" id="osr_foto" accept="image/*" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-blue-100 file:text-blue-700 hover:file:bg-blue-200 cursor-pointer">
                <div id="preview_container" class="hidden mt-3 relative inline-block">
                    <img id="preview_foto" class="max-h-32 rounded-xl object-cover border border-slate-300 shadow-sm">
                    <button type="button" onclick="window.removerFoto()" class="absolute -top-2 -right-2 w-6 h-6 bg-red-600 text-white rounded-full flex items-center justify-center shadow-md cursor-pointer hover:bg-red-700"><i class="fa-solid fa-xmark text-xs"></i></button>
                </div>
            </div>

            <!-- BOTÃO DE CONCLUSÃO -->
            <div class="pt-2">
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Conclusão / Status do Atendimento *</label>
                <select id="osr_conclusao" required onchange="window.verificarUrgencia()" class="w-full p-3 bg-blue-50 border border-blue-300 rounded-2xl text-xs font-bold text-blue-900 outline-none focus:border-blue-600 transition cursor-pointer">
                    <option value="" disabled selected>Selecione a conclusão...</option>
                    <option value="Resolvido">✅ Resolvido (Encerrar chamado)</option>
                    <option value="Marcar atendimento">📅 Marcar atendimento presencial / futuro</option>
                </select>
            </div>

            <!-- GATILHO DE URGÊNCIA -->
            <div id="box_urgencia" class="hidden bg-red-50 p-4 rounded-2xl border border-red-200 space-y-3">
                <label class="block text-[11px] font-bold text-red-800 uppercase text-center"><i class="fa-solid fa-triangle-exclamation"></i> Qual o grau de prioridade dessa visita?</label>
                <div class="grid grid-cols-2 gap-2">
                    <label class="flex flex-col items-center justify-center bg-white border border-slate-300 rounded-xl p-3 cursor-pointer hover:bg-slate-50 transition opacity-80 peer-checked:opacity-100" id="label_urg_normal">
                        <input type="radio" name="osr_urgencia" value="NORMAL" checked onchange="window.mudarEstiloUrgencia()" class="peer hidden">
                        <span class="text-xl mb-1">🟢</span>
                        <span class="text-[10px] font-bold text-slate-600 uppercase">Normal</span>
                    </label>
                    <label class="flex flex-col items-center justify-center bg-white border border-slate-300 rounded-xl p-3 cursor-pointer hover:bg-red-50 transition opacity-80 peer-checked:opacity-100" id="label_urg_critica">
                        <input type="radio" name="osr_urgencia" value="CRITICA" onchange="window.mudarEstiloUrgencia()" class="peer hidden">
                        <span class="text-xl mb-1">🚨</span>
                        <span class="text-[10px] font-bold text-red-600 uppercase">Urgente</span>
                    </label>
                </div>
            </div>

            <!-- BOTÕES DE AÇÃO -->
            <div class="pt-3 grid grid-cols-2 gap-2">
                <button type="button" id="btnSalvarApenas" onclick="window.processarAtendimento(false)" class="bg-slate-700 hover:bg-slate-800 text-white font-bold py-3 px-3 rounded-2xl shadow-sm transition text-xs flex items-center justify-center gap-1.5 cursor-pointer">
                    <i class="fa-solid fa-floppy-disk"></i> Apenas Salvar
                </button>
                <button type="button" id="btnSalvarEnviar" onclick="window.processarAtendimento(true)" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-3 rounded-2xl shadow-md transition text-xs flex items-center justify-center gap-1.5 cursor-pointer">
                    <i class="fa-solid fa-paper-plane"></i> Salvar & WhatsApp
                </button>
            </div>
        </form>

        <div class="p-4 bg-slate-50 text-center border-t border-slate-100 text-[10px] text-slate-400 font-medium">
            Portal Técnico Grupo CIJ &copy; <span id="anoAtualRodape">2026</span>
        </div>
    </div>

    <!-- MODAL DE HISTÓRICO -->
    <div id="modalHistorico" class="hidden fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-[9999] flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full border border-slate-200 overflow-hidden flex flex-col max-h-[85vh]">
            <div class="bg-slate-900 text-white p-4 flex items-center justify-between">
                <div>
                    <h3 class="font-bold text-xs flex items-center gap-2"><i class="fa-solid fa-history text-amber-400"></i> Histórico da Empresa</h3>
                    <p id="tituloModalCliente" class="text-[10px] text-slate-300 mt-0.5">Cliente Selecionado</p>
                </div>
                <button onclick="window.fecharModalHistorico()" class="text-slate-400 hover:text-white p-1 cursor-pointer"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>
            <div class="p-4 overflow-y-auto custom-scrollbar flex-1 space-y-3" id="listaHistoricoCliente"></div>
            <div class="p-4 bg-slate-50 border-t border-slate-100 text-right">
                <button onclick="window.fecharModalHistorico()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-bold rounded-xl transition cursor-pointer">Fechar</button>
            </div>
        </div>
    </div>

    <!-- MOTOR CENTRAL -->
    <script type="module" src="core.js"></script>
    <script type="module">
        import { runTransaction } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        window.FirebaseRunTransaction = runTransaction;
    </script>

    <!-- LÓGICA DO MÓDULO -->
    <script>
        let atendimentosCacheFirebase = [];
        window.clientesOficiais = [];
        window.maquinasGenericas = [];
        window.parqueMaquinas = [];
        window.fotoAnexadaBase64 = null;

        window.initModule = function(perfil) {
            document.getElementById('login-screen')?.classList.add('hidden');
            document.getElementById('main-content').classList.remove('hidden');
            document.getElementById('anoAtualRodape').innerText = new Date().getFullYear();

            const tecnicoLogado = window.nomeUsuarioLogado || (window.currentUser ? window.currentUser.email : 'Técnico CIJ');
            document.getElementById('osr_tecnico').value = tecnicoLogado;

            const osrCol = window.fsCollection(window.AppDB, 'artifacts', 'plataforma-cij', 'public', 'data', 'suportes_osr');
            window.fsOnSnapshot(osrCol, snap => {
                atendimentosCacheFirebase = [];
                snap.forEach(d => atendimentosCacheFirebase.push(d.data()));
            });

            const clientesCol = window.fsCollection(window.AppDB, 'artifacts', 'plataforma-cij', 'public', 'data', 'cadastros_clientes');
            window.fsOnSnapshot(clientesCol, snap => {
                window.clientesOficiais = [];
                const dl = document.getElementById('clientes-oficiais');
                if(dl) dl.innerHTML = '';
                snap.forEach(d => {
                    const c = d.data();
                    if(c.is_deleted === true || c.ativo === false) return;
                    const nomeFantasia = c.fantasia || c.nomeFantasia || c.razao_social || c.razaoSocial;
                    const contatos = Array.isArray(c.contatos) ? c.contatos : [];
                    const cp = contatos.find(x => x && x.principal === true) || contatos[0] || {};
                    const contatoNome = cp.nome || c.contatoPrincipalNome || c.contato || '';
                    const contatoTelefone = cp.telefone || c.contatoPrincipalTelefone || c.telefone || c.whatsapp || '';
                    const contatoFmt = [contatoNome, contatoTelefone].filter(Boolean).join(' - ');
                    const endereco = c.enderecoCompleto || c.endereco_completo || [
                        [c.logradouro || c.endereco, c.numero].filter(Boolean).join(', '),
                        [c.complemento, c.bairro].filter(Boolean).join(' · '),
                        [c.cidade, c.uf || c.estado].filter(Boolean).join(' - '),
                        c.cep ? `CEP ${c.cep}` : ''
                    ].filter(Boolean).join(' | ');

                    window.clientesOficiais.push({ id:d.id, nome:nomeFantasia, razao:c.razao_social || c.razaoSocial || '', contatoPrincipal:contatoFmt, contatoNome, contatoTelefone, endereco });
                    if(dl && nomeFantasia) {
                        dl.innerHTML += `<option value="${nomeFantasia}">`;
                        if(c.razao_social && c.razao_social !== nomeFantasia) dl.innerHTML += `<option value="${c.razao_social}">`;
                    }
                });
            });

            // LER MÁQUINAS GENÉRICAS (Para preencher se o cliente não tiver máquina no Parque)
            const maqCol = window.fsCollection(window.AppDB, 'artifacts', 'plataforma-cij', 'public', 'data', 'cadastros_equipamentos');
            window.fsOnSnapshot(maqCol, snap => {
                window.maquinasGenericas = [];
                snap.forEach(d => window.maquinasGenericas.push(d.data().modelo));
                window.atualizarListaMaquinas(''); 
            });

            // LER PARQUE DE MÁQUINAS ESTRATÉGICO
            const pmCol = window.fsCollection(window.AppDB, 'artifacts', 'plataforma-cij', 'public', 'data', 'parque_maquinas');
            window.fsOnSnapshot(pmCol, snap => {
                window.parqueMaquinas = [];
                snap.forEach(d => window.parqueMaquinas.push(d.data()));
            });
        };

        // --- FILTRO CASCATA (CLIENTE -> MÁQUINAS) ---
        window.atualizarListaMaquinas = function(clienteNome) {
            const dl = document.getElementById('maquinas-oficiais');
            dl.innerHTML = '';

            let maquinasDoCliente = [];
            if(clienteNome) {
                const cli = window.clientesOficiais.find(c => c.nome?.toLowerCase() === clienteNome.toLowerCase() || c.razao?.toLowerCase() === clienteNome.toLowerCase());
                maquinasDoCliente = window.parqueMaquinas.filter(m => {
                    if(cli?.id && String(m.clienteId || '') === String(cli.id)) return true;
                    const nome = String(m.clienteNome || m.cliente_atual || m.clienteAtual || '').toLowerCase();
                    return nome && (nome === String(cli?.nome || clienteNome).toLowerCase() || nome === String(cli?.razao || '').toLowerCase());
                });
            }
            
            if (maquinasDoCliente.length > 0) {
                // Preenche o datalist com as máquinas vinculadas ao cliente no topo
                maquinasDoCliente.forEach(m => {
                    dl.innerHTML += `<option value="[SN: ${m.serial}] ${m.modelo}">`;
                });
                // E logo abaixo, mantém as máquinas genéricas para ele escolher ou digitar outra
                window.maquinasGenericas.forEach(m => {
                    dl.innerHTML += `<option value="${m}">`;
                });
            } else {
                // Se o cliente não tem máquina, mostra só as genéricas
                window.maquinasGenericas.forEach(m => {
                    dl.innerHTML += `<option value="${m}">`;
                });
            }
        };

        // --- EXTRATOR DE NÚMERO DE SÉRIE ---
        window.extrairSerialMobile = function(valor) {
            const match = valor.match(/^\[SN: (.*?)\] (.*)$/);
            if (match) {
                document.getElementById('osr_serial').value = match[1].trim(); // Extrai o SN
                document.getElementById('osr_maquina').value = match[2].trim(); // Deixa só o modelo no campo da máquina
            }
        };

        window.buscarClientesSemelhantesEFiltrarMaquinas = function(valorInput) {
            const termo = valorInput.trim().toLowerCase();
            const alerta = document.getElementById('alertaClientesSimilares');
            const containerLista = document.getElementById('listaClientesSimilares');
            
            const clienteOficial = window.clientesOficiais.find(c => c.nome.toLowerCase() === termo || (c.razao && c.razao.toLowerCase() === termo));

            // Auto-preenche contato e endereço a partir do cadastro oficial
            window.clienteSelecionadoOSR = clienteOficial || null;
            const inputContato = document.getElementById('osr_contato');
            const inputEndereco = document.getElementById('osr_endereco');
            if (clienteOficial) {
                if (clienteOficial.contatoPrincipal) inputContato.value = clienteOficial.contatoPrincipal;
                if (inputEndereco) inputEndereco.value = clienteOficial.endereco || '';
            } else {
                if (inputEndereco) inputEndereco.value = '';
            }

            // ATIVA O FILTRO EM CASCATA DAS MÁQUINAS AQUI!
            window.atualizarListaMaquinas(clienteOficial ? clienteOficial.nome : termo);

            // Parte de mostrar histórico (Opcional)
            if (termo.length < 2) {
                alerta.classList.add('hidden');
                containerLista.innerHTML = '';
                return;
            }
            const clientesUnicosMap = new Map();
            atendimentosCacheFirebase.forEach(item => {
                const nomeNormalizado = (item.cliente || '').trim().toLowerCase();
                if (nomeNormalizado.includes(termo)) {
                    if (!clientesUnicosMap.has(nomeNormalizado)) clientesUnicosMap.set(nomeNormalizado, { nomeExibicao: item.cliente.trim(), atendimentos: [] });
                    clientesUnicosMap.get(nomeNormalizado).atendimentos.push(item);
                }
            });

            if (clientesUnicosMap.size > 0) {
                containerLista.innerHTML = '';
                clientesUnicosMap.forEach((dados) => {
                    containerLista.innerHTML += `
                        <div class="bg-white p-2.5 rounded-xl border border-amber-200 flex items-center justify-between gap-2 shadow-sm">
                            <div><strong class="text-xs text-slate-900 block">${dados.nomeExibicao}</strong><span class="text-[10px] text-slate-500">${dados.atendimentos.length} OS's</span></div>
                            <button type="button" onclick="window.selecionarClienteEVerHistorico('${dados.nomeExibicao.replace(/'/g, "\\'")}')" class="bg-amber-600 hover:bg-amber-700 text-white font-bold text-[10px] px-2.5 py-1.5 rounded-lg transition cursor-pointer shrink-0">Histórico</button>
                        </div>
                    `;
                });
                alerta.classList.remove('hidden');
            } else {
                alerta.classList.add('hidden');
            }
        };

        window.selecionarClienteEVerHistorico = function(nomeCliente) {
            document.getElementById('osr_cliente').value = nomeCliente;
            document.getElementById('alertaClientesSimilares').classList.add('hidden');
            window.atualizarListaMaquinas(nomeCliente);

            const historicoCliente = atendimentosCacheFirebase.filter(item => (item.cliente || '').trim().toLowerCase() === nomeCliente.trim().toLowerCase());
            document.getElementById('tituloModalCliente').innerText = `Empresa: ${nomeCliente}`;
            const container = document.getElementById('listaHistoricoCliente');
            container.innerHTML = '';

            historicoCliente.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

            historicoCliente.forEach(item => {
                container.innerHTML += `
                    <div class="p-3.5 bg-slate-50 border border-slate-200 rounded-2xl space-y-1.5">
                        <div class="flex items-center justify-between text-[11px]"><span class="font-bold text-blue-900">${item.osr}</span><span class="text-slate-400">${item.data_formatada || '-'}</span></div>
                        <p class="text-xs font-bold text-slate-800"><i class="fa-solid fa-print text-slate-400 mr-1"></i> ${item.maquina} ${item.serial ? `(SN: ${item.serial})` : ''}</p>
                        <p class="text-[11px] text-slate-600"><strong>Defeito:</strong> ${item.defeito}</p>
                        <p class="text-[11px] text-slate-600"><strong>Parecer:</strong> ${item.solucao}</p>
                        <div class="pt-1 flex items-center justify-between text-[10px]"><span class="text-slate-500">Por: ${item.tecnico}</span><span class="px-2 py-0.5 rounded bg-blue-100 text-blue-800 font-bold">${item.conclusao}</span></div>
                    </div>
                `;
            });
            document.getElementById('modalHistorico').classList.remove('hidden');
        };

        window.fecharModalHistorico = () => document.getElementById('modalHistorico').classList.add('hidden');

        // --- SISTEMA DE COMPRESSÃO DE FOTOS ---
        document.getElementById('osr_foto').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    const scaleSize = MAX_WIDTH / img.width;
                    if (img.width > MAX_WIDTH) { canvas.width = MAX_WIDTH; canvas.height = img.height * scaleSize; } 
                    else { canvas.width = img.width; canvas.height = img.height; }
                    
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    window.fotoAnexadaBase64 = canvas.toDataURL('image/jpeg', 0.7);
                    
                    const preview = document.getElementById('preview_foto');
                    preview.src = window.fotoAnexadaBase64;
                    document.getElementById('preview_container').classList.remove('hidden');
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });

        window.removerFoto = function() {
            window.fotoAnexadaBase64 = null;
            document.getElementById('osr_foto').value = '';
            document.getElementById('preview_container').classList.add('hidden');
            document.getElementById('preview_foto').src = '';
        };

        window.verificarUrgencia = function() {
            const conclusao = document.getElementById('osr_conclusao').value;
            const boxUrgencia = document.getElementById('box_urgencia');
            if (conclusao === 'Marcar atendimento') { boxUrgencia.classList.remove('hidden'); window.mudarEstiloUrgencia(); } 
            else { boxUrgencia.classList.add('hidden'); }
        };

        window.mudarEstiloUrgencia = function() {
            const radio = document.querySelector('input[name="osr_urgencia"]:checked').value;
            const lblNorm = document.getElementById('label_urg_normal');
            const lblCrit = document.getElementById('label_urg_critica');
            const boxUrgencia = document.getElementById('box_urgencia');

            if (radio === 'CRITICA') {
                lblNorm.classList.replace('border-blue-500', 'border-slate-300');
                lblCrit.classList.replace('border-slate-300', 'border-red-500');
                lblCrit.classList.add('bg-red-50', 'ring-2', 'ring-red-200');
                lblNorm.classList.remove('bg-blue-50', 'ring-2', 'ring-blue-200');
                boxUrgencia.classList.add('pulse-urgencia', 'border-red-400');
            } else {
                lblCrit.classList.replace('border-red-500', 'border-slate-300');
                lblNorm.classList.replace('border-slate-300', 'border-blue-500');
                lblNorm.classList.add('bg-blue-50', 'ring-2', 'ring-blue-200');
                lblCrit.classList.remove('bg-red-50', 'ring-2', 'ring-red-200');
                boxUrgencia.classList.remove('pulse-urgencia', 'border-red-400');
            }
        };

        window.processarAtendimento = async function(enviarWhatsApp) {
            const form = document.getElementById('formSuporteMobile');
            if(!form.checkValidity()) { form.reportValidity(); return; }

            const btnApenas = document.getElementById('btnSalvarApenas');
            const btnEnviar = document.getElementById('btnSalvarEnviar');
            btnApenas.disabled = true; btnEnviar.disabled = true;
            btnApenas.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Aguarde...';

            const conclusaoSelecionada = document.getElementById('osr_conclusao').value;
            let nivelUrgencia = 'NORMAL';
            if (conclusaoSelecionada === 'Marcar atendimento') {
                nivelUrgencia = document.querySelector('input[name="osr_urgencia"]:checked').value;
            }

            const dados = {
                tecnico: document.getElementById('osr_tecnico').value,
                cliente: document.getElementById('osr_cliente').value.trim(),
                clienteId: window.clienteSelecionadoOSR?.id || '',
                clienteEndereco: document.getElementById('osr_endereco')?.value || window.clienteSelecionadoOSR?.endereco || '',
                clienteContatoNome: window.clienteSelecionadoOSR?.contatoNome || '',
                clienteContatoTelefone: window.clienteSelecionadoOSR?.contatoTelefone || '',
                contato: document.getElementById('osr_contato').value,
                maquina: document.getElementById('osr_maquina').value,
                serial: document.getElementById('osr_serial').value.trim(),
                defeito: document.getElementById('osr_defeito').value,
                solucao: document.getElementById('osr_solucao').value,
                pecas: document.getElementById('osr_pecas').value.trim(),
                conclusao: conclusaoSelecionada,
                urgencia: nivelUrgencia,
                fotoBase64: window.fotoAnexadaBase64,
                data_formatada: new Date().toLocaleString('pt-BR'),
                autor_email: window.currentUser ? window.currentUser.email : ''
            };

            try {
                const counterRef = window.fsDoc(window.AppDB, 'artifacts', 'plataforma-cij', 'public', 'data', 'counters', 'osr');
                const numFormatado = await window.FirebaseRunTransaction(window.AppDB, async (transaction) => {
                    const counterDoc = await transaction.get(counterRef);
                    let currentNum = 1000;
                    if (counterDoc.exists()) currentNum = counterDoc.data().current || 1000;
                    const nextNum = currentNum + 1;
                    transaction.set(counterRef, { current: nextNum }, { merge: true });
                    const anoAtual = new Date().getFullYear();
                    const numeroGerado = `OSR-${anoAtual}-${nextNum}`;
                    dados.osr = numeroGerado;
                    dados.timestamp = new Date().getTime();
                    
                    const docRef = window.fsDoc(window.AppDB, 'artifacts', 'plataforma-cij', 'public', 'data', 'suportes_osr', numeroGerado);
                    transaction.set(docRef, dados);
                    return numeroGerado;
                });

                if (enviarWhatsApp) {
                    let msgWhatsApp = `*RELATÓRIO DE SUPORTE - OSR* %0A*OSR:* ${dados.osr} %0A*Técnico:* ${dados.tecnico} %0A*Cliente:* ${dados.cliente} %0A*Contato:* ${dados.contato} ${dados.clienteEndereco ? `%0A*Endereço:* ${dados.clienteEndereco}` : ''} %0A*Máquina:* ${dados.maquina} ${dados.serial ? `(SN: ${dados.serial})` : ''} %0A*Defeito:* ${dados.defeito} %0A*Parecer Técnico:* ${dados.solucao} %0A`;
                    if (dados.pecas) msgWhatsApp += `*Peças:* ${dados.pecas} %0A`;
                    msgWhatsApp += `*Status:* ${dados.conclusao}`;
                    if (nivelUrgencia === 'CRITICA') msgWhatsApp += ` %0A🚨 *PRIORIDADE URGENTE*`;
                    
                    window.open(`https://api.whatsapp.com/send?text=${msgWhatsApp}`, '_blank');
                } else {
                    alert(`Atendimento ${dados.osr} salvo com sucesso no sistema!`);
                }

                form.reset();
                window.removerFoto();
                document.getElementById('alertaClientesSimilares').classList.add('hidden');
                document.getElementById('box_urgencia').classList.add('hidden');
                document.getElementById('osr_tecnico').value = dados.tecnico;
                document.getElementById('osr_numero').value = '';

            } catch (error) {
                alert("Erro ao salvar o atendimento no banco de dados. Verifique a conexão.");
            } finally {
                btnApenas.disabled = false; btnEnviar.disabled = false;
                btnApenas.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Apenas Salvar';
            }
        };
    </script>
</body>
</html>
