<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Despesas - Portal CIJ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; color: #0f172a; }
        .leadjet-logo-icon { width: 28px; height: 28px; display: inline-block; }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-12">

    <header class="bg-[#0f172a] text-white shadow-md border-b border-slate-800 sticky top-0 z-40 no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <div class="p-1.5 bg-white/10 rounded-xl flex items-center justify-center border border-white/20">
                        <svg class="leadjet-logo-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M50 10 L85 45 L50 80 L15 45 Z" fill="#0077C8"/><path d="M50 20 L75 45 L50 70 L25 45 Z" fill="#64B5F6"/></svg>
                    </div>
                    <div>
                        <div class="flex items-center gap-2">
                            <span class="text-[10px] font-extrabold uppercase tracking-wider text-sky-300 bg-sky-950 px-2 py-0.5 rounded border border-sky-800">MÓDULO OPERACIONAL</span>
                            <span id="user-role-badge" class="text-[10px] font-bold px-2 py-0.5 rounded border flex items-center gap-1 bg-slate-800 text-slate-300 border-slate-600">Verificando...</span>
                        </div>
                        <h1 class="text-base font-bold tracking-tight text-white leading-tight">Controle de Despesas</h1>
                    </div>
                </div>
                <nav class="flex space-x-2 items-center">
                    <a href="index.html" class="px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 bg-slate-800 text-slate-300 hover:text-white hover:bg-slate-700 border border-slate-600 shadow-sm"><i class="fa-solid fa-arrow-left"></i> Voltar ao Hub</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <section id="sec-form-despesas" class="lg:col-span-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-200 h-fit no-print">
                <div class="flex items-center justify-between border-b border-slate-200 pb-4 mb-6">
                    <div class="flex items-center gap-2"><i class="fa-solid fa-receipt text-sky-600 text-lg"></i><h2 class="text-base font-bold text-slate-900">Novo Lançamento</h2></div>
                    <span id="desp-num-badge" class="text-[10px] px-2.5 py-1 bg-sky-100 text-sky-800 font-extrabold rounded-full border border-sky-300">Carregando...</span>
                </div>
                <form id="expense-form" class="space-y-4" onsubmit="salvarDespesa(event)">
                    <div><label class="block text-xs font-bold text-slate-700 uppercase mb-1">Técnico / Vendedor *</label><select id="desp_tecnico" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs font-semibold outline-none focus:border-sky-500"><option value="" disabled selected>Selecione...</option><option value="Filipe">Filipe</option><option value="Anderson">Anderson</option><option value="Adriano">Adriano</option><option value="Rafael">Rafael</option><option value="Gabriel">Gabriel</option><option value="Sidnei">Sidnei</option></select></div>
                    <div class="grid grid-cols-2 gap-3">
                        <div><label class="block text-xs font-bold text-slate-700 uppercase mb-1">Cliente *</label><input type="text" id="desp_cliente" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs outline-none focus:border-sky-500"></div>
                        <div><label class="block text-xs font-bold text-slate-700 uppercase mb-1">Cidade *</label><input type="text" id="desp_cidade" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs outline-none focus:border-sky-500"></div>
                    </div>
                    <div><label class="block text-xs font-bold text-slate-700 uppercase mb-1">Descrição *</label><input type="text" id="desp_descricao" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs outline-none focus:border-sky-500"></div>
                    <div class="grid grid-cols-2 gap-3">
                        <div><label class="block text-xs font-bold text-slate-700 uppercase mb-1">Valor (R$) *</label><input type="number" id="desp_valor" step="0.01" required class="w-full px-3 py-2.5 bg-sky-50 border border-sky-300 text-sky-900 rounded-xl text-xs font-bold outline-none focus:border-sky-600"></div>
                        <div><label class="block text-xs font-bold text-slate-700 uppercase mb-1">Data *</label><input type="date" id="desp_data" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs font-medium outline-none focus:border-sky-500"></div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div><label class="block text-xs font-bold text-slate-700 uppercase mb-1">Categoria *</label><select id="desp_categoria" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs font-semibold outline-none focus:border-sky-500"><option value="Combustível">Combustível</option><option value="Pedágio">Pedágio</option><option value="Alimentação/Bebida">Alimentação/Bebida</option><option value="Peças/Ferramentas">Peças/Ferramentas</option><option value="Hotel">Hotel</option><option value="Outros">Outros</option></select></div>
                        <div><label class="block text-xs font-bold text-slate-700 uppercase mb-1">Pagamento *</label><select id="desp_cartao" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs outline-none focus:border-sky-500"><option value="Mastercard **0067">Mastercard **0067</option><option value="Mastercard **9553">Mastercard **9553</option><option value="Visa **7543">Visa **7543</option><option value="Dinheiro / Pix">Dinheiro / Pix</option></select></div>
                    </div>
                    <button type="submit" id="btn-submit" class="w-full py-3 bg-sky-600 hover:bg-sky-700 text-white font-extrabold rounded-xl text-xs shadow-md">Adicionar Despesa</button>
                    <button type="button" onclick="iniciarNovoRelatorio()" class="w-full py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-xl text-xs">Novo Relatório</button>
                </form>
            </section>

            <section class="lg:col-span-8 space-y-4">
                <div class="flex items-center justify-between bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                    <h3 class="text-sm font-bold text-slate-900">Histórico de Relatórios</h3>
                    <div id="desp-total-acumulado" class="text-lg font-black text-sky-800">R$ 0,00</div>
                </div>
                <div id="despesas-list" class="space-y-3">
                    <!-- Lista de Acordeons será injetada aqui -->
                </div>
            </section>
        </div>
    </main>

    <div id="toast" class="fixed bottom-5 right-5 hidden z-50 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3"><i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400"></i><span id="toast-message" class="text-xs font-semibold">Sucesso!</span></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, query, orderBy, runTransaction } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDW05GuYDxXUCmtWfSxhfap1-l6_qkNspw", authDomain: "plataforma-cij.firebaseapp.com", projectId: "plataforma-cij", storageBucket: "plataforma-cij.firebasestorage.app", messagingSenderId: "949985395100", appId: "1:949985395100:web:cf881e0c91c63175228859" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const appId = 'plataforma-cij';

        // Carregar Dados
        onSnapshot(query(collection(db, 'artifacts', appId, 'public', 'data', 'despesas'), orderBy('timestamp', 'desc')), (snap) => {
            window.listaDespesas = []; snap.forEach(d => window.listaDespesas.push(d.data()));
            if(window.renderizar) window.renderizar();
        });

        window.dbSalvar = async function(desp) {
            const counterRef = doc(db, 'artifacts', appId, 'public', 'data', 'counters', 'despesas');
            await runTransaction(db, async (t) => {
                const cDoc = await t.get(counterRef);
                const current = cDoc.exists() ? cDoc.data().current : 1000;
                if(!desp.num_relatorio) { // Se não tiver número, busca o último ou cria
                    desp.num_relatorio = `REL-${current}`;
                    t.set(counterRef, { current: current + 1 }, { merge: true });
                }
                t.set(doc(db, 'artifacts', appId, 'public', 'data', 'despesas', desp.id), desp);
            });
        };

        window.dbExcluir = async function(id) { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'despesas', id)); };
    </script>

    <script>
        window.listaDespesas = [];
        window.numRelatorioAtual = localStorage.getItem('cij_last_rel') || 'REL-1001';
        
        window.iniciarNovoRelatorio = function() {
            const num = parseInt(window.numRelatorioAtual.replace('REL-', '')) + 1;
            window.numRelatorioAtual = `REL-${num}`;
            localStorage.setItem('cij_last_rel', window.numRelatorioAtual);
            document.getElementById('desp-num-badge').innerText = window.numRelatorioAtual;
            window.mostrarNotificacao("Novo relatório iniciado: " + window.numRelatorioAtual);
        };

        window.salvarDespesa = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-submit'); btn.disabled = true;
            const nova = {
                id: Date.now().toString(), num_relatorio: window.numRelatorioAtual, tecnico: document.getElementById('desp_tecnico').value, 
                cliente: document.getElementById('desp_cliente').value, cidade: document.getElementById('desp_cidade').value, 
                descricao: document.getElementById('desp_descricao').value, valor: parseFloat(document.getElementById('desp_valor').value), 
                data: document.getElementById('desp_data').value, categoria: document.getElementById('desp_categoria').value, 
                timestamp: Date.now()
            };
            try { await window.dbSalvar(nova); window.mostrarNotificacao('Salvo!'); document.getElementById('expense-form').reset(); }
            catch(err) { alert(err.message); } finally { btn.disabled = false; }
        };

        window.renderizar = function() {
            const list = document.getElementById('despesas-list');
            const grouped = window.listaDespesas.reduce((acc, obj) => { (acc[obj.num_relatorio] = acc[obj.num_relatorio] || []).push(obj); return acc; }, {});
            
            let total = 0; list.innerHTML = '';
            Object.keys(grouped).sort().reverse().forEach(rel => {
                const items = grouped[rel];
                const relTotal = items.reduce((sum, item) => sum + item.valor, 0);
                total += relTotal;
                
                const card = document.createElement('div');
                card.className = "bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden";
                card.innerHTML = `
                    <div class="p-4 bg-slate-50 flex items-center justify-between cursor-pointer" onclick="this.nextElementSibling.classList.toggle('hidden')">
                        <div class="font-bold text-sky-900">${rel} <span class="text-slate-400 text-xs font-normal">(${items.length} itens)</span></div>
                        <div class="font-black text-slate-800">R$ ${relTotal.toFixed(2)}</div>
                    </div>
                    <div class="hidden p-4">
                        <table class="w-full text-xs">
                            ${items.map(i => `<tr><td class="py-2">${i.data}</td><td class="py-2 font-bold">${i.cliente}</td><td class="py-2 text-right">R$ ${i.valor.toFixed(2)}</td></tr>`).join('')}
                        </table>
                    </div>
                `;
                list.appendChild(card);
            });
            document.getElementById('desp-total-acumulado').innerText = `R$ ${total.toFixed(2)}`;
        };

        window.mostrarNotificacao = function(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = msg;
            toast.classList.remove('hidden'); setTimeout(() => toast.classList.add('hidden'), 3000);
        };

        window.addEventListener('DOMContentLoaded', () => { 
            document.getElementById('desp_data').valueAsDate = new Date();
            document.getElementById('desp-num-badge').innerText = window.numRelatorioAtual;
        });
    </script>
</body>
</html>
