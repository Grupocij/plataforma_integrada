<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Despesas - Portal CIJ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; color: #0f172a; }
        .no-print { display: block; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-12">

    <header class="bg-[#0f172a] text-white shadow-md border-b border-slate-800 sticky top-0 z-40 no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <div class="p-1.5 bg-white/10 rounded-xl border border-white/20">
                        <svg class="w-7 h-7" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M50 10 L85 45 L50 80 L15 45 Z" fill="#0077C8"/><path d="M50 20 L75 45 L50 70 L25 45 Z" fill="#64B5F6"/></svg>
                    </div>
                    <div>
                        <div class="flex items-center gap-2">
                            <span class="text-[10px] font-extrabold uppercase text-sky-300 bg-sky-950 px-2 py-0.5 rounded border border-sky-800">MÓDULO OPERACIONAL</span>
                            <span id="user-role-badge" class="text-[10px] font-bold px-2 py-0.5 rounded border flex items-center gap-1 bg-slate-800 text-slate-300 border-slate-600">Verificando...</span>
                        </div>
                        <h1 class="text-base font-bold text-white leading-tight">Controle de Despesas</h1>
                    </div>
                </div>
                <a href="index.html" class="px-4 py-2 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 hover:text-white border border-slate-600 transition"><i class="fa-solid fa-arrow-left mr-2"></i> Voltar ao Hub</a>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <section class="lg:col-span-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-200 h-fit">
                <div class="flex items-center justify-between border-b border-slate-200 pb-4 mb-6">
                    <h2 class="text-base font-bold text-slate-900" id="form-title">Novo Lançamento</h2>
                    <span id="desp-num-badge" class="text-[10px] px-2.5 py-1 bg-sky-100 text-sky-800 font-extrabold rounded-full border border-sky-300">REL-1000</span>
                </div>
                
                <form id="expense-form" class="space-y-4">
                    <input type="hidden" id="edit_id">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Técnico / Vendedor *</label>
                        <select id="desp_tecnico" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs font-semibold outline-none focus:border-sky-500">
                            <option value="">Selecione...</option><option value="Filipe">Filipe</option><option value="Anderson">Anderson</option><option value="Adriano">Adriano</option><option value="Rafael">Rafael</option><option value="Gabriel">Gabriel</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div><label class="block text-xs font-bold text-slate-700 uppercase mb-1">Cliente *</label><input type="text" id="desp_cliente" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs outline-none focus:border-sky-500"></div>
                        <div><label class="block text-xs font-bold text-slate-700 uppercase mb-1">Cidade *</label><input type="text" id="desp_cidade" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs outline-none focus:border-sky-500"></div>
                    </div>
                    <div><label class="block text-xs font-bold text-slate-700 uppercase mb-1">Descrição *</label><input type="text" id="desp_descricao" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs outline-none focus:border-sky-500"></div>
                    <div class="grid grid-cols-2 gap-3">
                        <div><label class="block text-xs font-bold text-slate-700 uppercase mb-1">Valor (R$) *</label><input type="number" id="desp_valor" step="0.01" required class="w-full px-3 py-2.5 bg-sky-50 border border-sky-300 text-sky-900 rounded-xl text-xs font-bold outline-none focus:border-sky-600"></div>
                        <div><label class="block text-xs font-bold text-slate-700 uppercase mb-1">Data *</label><input type="date" id="desp_data" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs font-medium outline-none focus:border-sky-500"></div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div><label class="block text-xs font-bold text-slate-700 uppercase mb-1">Categoria *</label><select id="desp_categoria" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs font-semibold outline-none focus:border-sky-500"><option value="Combustível">Combustível</option><option value="Pedágio">Pedágio</option><option value="Alimentação">Alimentação</option><option value="Hotel">Hotel</option></select></div>
                        <div><label class="block text-xs font-bold text-slate-700 uppercase mb-1">Pagamento *</label><select id="desp_cartao" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs outline-none focus:border-sky-500"><option value="Mastercard">Mastercard</option><option value="Pix/Dinheiro">Pix/Dinheiro</option></select></div>
                    </div>
                    <button type="button" onclick="salvarDespesa()" id="btn-submit" class="w-full py-3 bg-sky-600 hover:bg-sky-700 text-white font-extrabold rounded-xl text-xs transition">Adicionar Despesa</button>
                    <button type="button" onclick="limparDadosCliente()" class="w-full py-2 bg-slate-100 text-slate-600 font-bold rounded-xl text-xs hover:bg-slate-200">Limpar Dados do Cliente</button>
                </form>
            </section>

            <section class="lg:col-span-8 space-y-4">
                <div class="flex items-center justify-between bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <h3 class="text-base font-bold text-slate-900">Histórico de Relatórios</h3>
                    <div id="desp-total-acumulado" class="text-xl font-black text-sky-900 bg-sky-50 px-4 py-2 rounded-xl border border-sky-200">R$ 0,00</div>
                </div>
                <div id="despesas-list" class="space-y-3"></div>
            </section>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDW05GuYDxXUCmtWfSxhfap1-l6_qkNspw", authDomain: "plataforma-cij.firebaseapp.com", projectId: "plataforma-cij", storageBucket: "plataforma-cij.firebasestorage.app", messagingSenderId: "949985395100", appId: "1:949985395100:web:cf881e0c91c63175228859" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'plataforma-cij';

        onAuthStateChanged(auth, (user) => {
            const badge = document.getElementById('user-role-badge');
            if (user) {
                badge.innerText = 'Autenticado';
                badge.className = "text-[10px] font-bold px-2 py-0.5 rounded border flex items-center gap-1 bg-emerald-950 text-emerald-300 border-emerald-800";
            } else {
                badge.innerText = 'Visitante / Mod. Livre';
            }
        });

        const despRef = collection(db, 'artifacts', appId, 'public', 'data', 'despesas');
        onSnapshot(query(despRef, orderBy('timestamp', 'desc')), (snap) => {
            window.listaDespesas = [];
            snap.forEach(d => window.listaDespesas.push(d.data()));
            window.renderizar();
        });

        window.salvarDespesa = async function() {
            const id = document.getElementById('edit_id').value || Date.now().toString();
            const nova = {
                id: id,
                num_relatorio: document.getElementById('desp-num-badge').innerText,
                tecnico: document.getElementById('desp_tecnico').value,
                cliente: document.getElementById('desp_cliente').value,
                cidade: document.getElementById('desp_cidade').value,
                descricao: document.getElementById('desp_descricao').value,
                valor: parseFloat(document.getElementById('desp_valor').value) || 0,
                data: document.getElementById('desp_data').value,
                categoria: document.getElementById('desp_categoria').value,
                cartao: document.getElementById('desp_cartao').value,
                timestamp: Date.now()
            };
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'despesas', id);
            await setDoc(docRef, nova, { merge: true });
            
            document.getElementById('desp_descricao').value = '';
            document.getElementById('desp_valor').value = '';
            document.getElementById('edit_id').value = '';
            alert("Despesa salva com sucesso!");
        };

        window.limparDadosCliente = function() {
            document.getElementById('desp_tecnico').value = '';
            document.getElementById('desp_cliente').value = '';
            document.getElementById('desp_cidade').value = '';
        };

        window.renderizar = function() {
            const container = document.getElementById('despesas-list');
            const grouped = window.listaDespesas.reduce((acc, obj) => {
                const key = obj.num_relatorio;
                (acc[key] = acc[key] || []).push(obj);
                return acc;
            }, {});

            container.innerHTML = '';
            Object.keys(grouped).sort().reverse().forEach(rel => {
                const items = grouped[rel];
                const total = items.reduce((s, i) => s + i.valor, 0);
                const div = document.createElement('div');
                div.className = "bg-white rounded-xl border border-slate-200 overflow-hidden";
                div.innerHTML = `
                    <div class="p-4 bg-slate-50 flex justify-between cursor-pointer hover:bg-slate-100" onclick="this.nextElementSibling.classList.toggle('hidden')">
                        <span class="font-bold text-sky-900">${rel} - ${items[0].cliente}</span>
                        <span class="font-black text-sky-700">R$ ${total.toFixed(2)}</span>
                    </div>
                    <div class="hidden p-2 bg-white">
                        ${items.map(i => `
                            <div class="flex justify-between items-center p-3 border-b text-xs">
                                <div><span class="font-bold block">${i.descricao}</span><span class="text-slate-500">${i.categoria} | ${i.data}</span></div>
                                <div class="flex items-center gap-3"><span class="font-bold text-sky-800">R$ ${i.valor.toFixed(2)}</span><button onclick="editar('${i.id}')" class="text-sky-600 hover:text-sky-800"><i class="fa-solid fa-pen-to-square"></i></button></div>
                            </div>
                        `).join('')}
                    </div>
                `;
                container.appendChild(div);
            });
        };

        window.editar = function(id) {
            const item = window.listaDespesas.find(x => x.id === id);
            document.getElementById('edit_id').value = item.id;
            document.getElementById('desp_descricao').value = item.descricao;
            document.getElementById('desp_valor').value = item.valor;
            document.getElementById('desp_tecnico').value = item.tecnico;
            document.getElementById('desp_cliente').value = item.cliente;
            document.getElementById('desp_cidade').value = item.cidade;
            document.getElementById('desp_data').value = item.data;
            document.getElementById('desp_categoria').value = item.categoria;
            document.getElementById('desp_cartao').value = item.cartao;
            window.scrollTo({top: 0, behavior: 'smooth'});
        };

        window.addEventListener('beforeunload', (e) => {
            const inputs = ['desp_descricao', 'desp_cliente', 'desp_valor', 'desp_tecnico', 'desp_cidade'];
            let hasData = inputs.some(id => document.getElementById(id).value.trim() !== "");
            if(hasData) {
                e.preventDefault(); e.returnValue = '';
            }
        });

        window.addEventListener('DOMContentLoaded', () => { document.getElementById('desp_data').valueAsDate = new Date(); });
    </script>
</body>
</html>
