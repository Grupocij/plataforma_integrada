<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Financeiro - Portal CIJ</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; overflow-x: hidden; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 5px; }
        
        /* REGRAS ESPECIAIS PARA A GERAÇÃO PERFEITA DO PDF */
        @media print {
            @page { size: A4 portrait; margin: 8mm; }
            body { background: white !important; color: black !important; padding: 0 !important; margin: 0 !important; font-size: 11px !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .no-print { display: none !important; }
            body > header { display: none !important; }
            main { padding: 0 !important; max-width: 100% !important; margin-top: 0 !important; height: auto !important; overflow: visible !important; }
            .space-y-5 > :not([hidden]) ~ :not([hidden]) { margin-top: 12px !important; }
            .card-simulador { border: 1px solid #cbd5e1 !important; border-radius: 8px !important; box-shadow: none !important; padding: 12px 16px !important; margin-bottom: 10px !important; break-inside: avoid !important; }
            .card-simulador-resumo { background-color: #002d72 !important; color: #ffffff !important; -webkit-print-color-adjust: exact; break-inside: avoid !important; padding: 12px !important; }
            input, select { border: 1px solid #cbd5e1 !important; background: transparent !important; color: #000 !important; padding: 4px 8px !important; font-size: 11px !important; }
            h2 { font-size: 16px !important; margin-bottom: 2px !important; }
            p.text-sm { font-size: 10px !important; }
            .mb-4 { margin-bottom: 8px !important; }
            .pb-2 { padding-bottom: 4px !important; }
            .pt-4 { padding-top: 8px !important; }
            .gap-5 { gap: 10px !important; }
            .gap-4 { gap: 10px !important; }
            .text-2xl { font-size: 18px !important; }
            .mt-5 { margin-top: 10px !important; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-12 bg-slate-50">

    <!-- ÁREA CENTRAL (MÓDULO SIMULADOR) -->
    <main class="flex-1 w-full max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-5 custom-scrollbar overflow-y-auto h-[calc(100vh-64px)] hidden" id="main-content">
        
        <div class="card-simulador bg-white p-6 rounded-3xl shadow-sm border border-slate-200 text-center relative">
            <h2 class="text-2xl font-black text-[#002d72] tracking-tight">Simulador Leadjet</h2>
            <p class="text-sm text-slate-500 mt-1 font-medium">Projeção Oficial de Custos Operacionais e Consumo de Insumos CIJ</p>
            <button onclick="window.print()" class="absolute right-5 top-1/2 -translate-y-1/2 no-print px-4 py-2.5 bg-[#002d72] hover:bg-blue-900 text-white font-bold rounded-xl text-xs transition flex items-center gap-2 shadow-sm">
                <i class="fa-solid fa-file-pdf text-sm"></i> Salvar PDF
            </button>
        </div>

        <div class="card-simulador bg-white p-6 rounded-3xl shadow-sm border border-slate-200 mb-5">
            <h3 class="text-xs font-bold text-slate-900 uppercase tracking-wider mb-4 pb-2 border-b border-slate-100 flex items-center gap-2"><i class="fa-solid fa-building text-teal-600"></i> Dados da Simulação</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="block font-bold text-xs text-slate-700 mb-1.5 uppercase tracking-wide">Cliente / Empresa</label>
                    <input type="text" id="sim_cliente" placeholder="Nome da empresa..." class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm font-medium outline-none focus:border-teal-600 transition">
                </div>
                <div>
                    <label class="block font-bold text-xs text-slate-700 mb-1.5 uppercase tracking-wide">Consultor Responsável</label>
                    <input type="text" id="sim_consultor" placeholder="Seu nome..." class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm font-bold outline-none focus:border-teal-600 transition text-teal-900">
                </div>
            </div>
        </div>

        <div class="card-simulador bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
            <h3 class="text-xs font-bold text-slate-900 uppercase tracking-wider mb-4 pb-2 border-b border-slate-100 flex items-center gap-2"><i class="fa-solid fa-sliders text-teal-600"></i> Parâmetros de Produção</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="block font-bold text-xs text-slate-700 mb-1.5 uppercase tracking-wide">Tipo de Matriz</label>
                    <select id="tipoMatriz" onchange="window.calcularSimuladorOficial()" class="w-full p-2.5 bg-slate-50 border border-slate-300 text-slate-900 rounded-xl text-sm font-semibold outline-none focus:border-teal-600">
                        <option value="14">5x5 (14 pts)</option><option value="16" selected>7x5 (16 pts)</option><option value="22">7x9 (22 pts)</option><option value="26">7x12 (26 pts)</option><option value="81">11x16 (81 pts)</option><option value="108">14x20 (108 pts)</option><option value="171">16x24 (171 pts)</option>
                    </select>
                </div>
                <div><label class="block font-bold text-xs text-slate-700 mb-1.5 uppercase tracking-wide">Caracteres <span class="text-teal-600 font-black ml-1" id="display-pontos">(Pts: 0)</span></label><input type="number" id="caracteres" value="150" oninput="window.calcularSimuladorOficial()" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm font-bold outline-none focus:border-teal-600"></div>
                <div><label class="block font-bold text-xs text-slate-700 mb-1.5 uppercase tracking-wide">Extras</label><select id="extras" onchange="window.calcularSimuladorOficial()" class="w-full p-2.5 bg-slate-50 border border-slate-300 text-slate-900 rounded-xl text-sm font-semibold outline-none focus:border-teal-600"><option value="0">Nenhum</option><option value="623">Cód. Barras (+623 pts)</option><option value="118">QR Code (+118 pts)</option></select></div>
                <div><label class="block font-bold text-xs text-slate-700 mb-1.5 uppercase tracking-wide">Imp. p/ Minuto</label><input type="number" id="imp_min" value="60" oninput="window.calcularSimuladorOficial()" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm font-bold outline-none focus:border-teal-600"></div>
                <div><label class="block font-bold text-xs text-slate-700 mb-1.5 uppercase tracking-wide">Dias / Mês</label><input type="number" id="dias" value="22" oninput="window.calcularSimuladorOficial()" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm font-bold outline-none focus:border-teal-600"></div>
                <div><label class="block font-bold text-xs text-slate-700 mb-1.5 uppercase tracking-wide">Horas / Dia</label><input type="number" id="horas" value="16" oninput="window.calcularSimuladorOficial()" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm font-bold outline-none focus:border-teal-600"></div>
                <div class="md:col-span-2"><label class="block font-bold text-xs text-slate-700 mb-1.5 uppercase tracking-wide">Temperatura (°C)</label><select id="temperatura" onchange="window.calcularSimuladorOficial()" class="w-full p-2.5 bg-slate-50 border border-slate-300 text-slate-900 rounded-xl text-sm font-semibold outline-none focus:border-teal-600"><option value="10">10°C</option><option value="12">12°C</option><option value="14">14°C</option><option value="16">16°C</option><option value="18">18°C</option><option value="20" selected>20°C</option><option value="22">22°C</option><option value="24">24°C</option><option value="26">26°C</option><option value="28">28°C</option><option value="30">30°C</option></select></div>
                <div class="md:col-span-2 grid grid-cols-1 sm:grid-cols-2 gap-5 pt-4 border-t border-slate-100">
                    <div><label class="block font-bold text-xs text-blue-700 mb-1.5 uppercase tracking-wide">Preço Tinta - R$</label><input type="number" id="precoTinta" value="1250" oninput="window.calcularSimuladorOficial()" class="w-full p-3 bg-blue-50 border border-blue-200 text-blue-900 rounded-xl text-sm font-black outline-none focus:border-blue-600"></div>
                    <div><label class="block font-bold text-xs text-indigo-700 mb-1.5 uppercase tracking-wide">Preço Solvente - R$</label><input type="number" id="precoSolvente" value="250" oninput="window.calcularSimuladorOficial()" class="w-full p-3 bg-indigo-50 border border-indigo-200 text-indigo-900 rounded-xl text-sm font-black outline-none focus:border-indigo-600"></div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="bg-gradient-to-br from-[#002d72] to-[#001b44] text-white p-5 rounded-3xl text-center shadow-md card-simulador-resumo"><label class="block text-blue-200 text-[11px] font-bold uppercase tracking-wider mb-1">Custo / Impressão</label><span id="res-unitario" class="text-2xl font-black">R$ 0,0000</span></div>
            <div class="bg-gradient-to-br from-[#002d72] to-[#001b44] text-white p-5 rounded-3xl text-center shadow-md card-simulador-resumo"><label class="block text-blue-200 text-[11px] font-bold uppercase tracking-wider mb-1">Custo Diário</label><span id="res-diario" class="text-2xl font-black">R$ 0,00</span></div>
            <div class="bg-gradient-to-br from-[#002d72] to-[#001b44] text-white p-5 rounded-3xl text-center shadow-md card-simulador-resumo border-2 border-teal-400/30"><label class="block text-teal-200 text-[11px] font-bold uppercase tracking-wider mb-1">Custo Mensal</label><span id="res-mensal" class="text-2xl font-black text-teal-400">R$ 0,00</span></div>
            <div class="bg-gradient-to-br from-[#002d72] to-[#001b44] text-white p-5 rounded-3xl text-center shadow-md card-simulador-resumo"><label class="block text-blue-200 text-[11px] font-bold uppercase tracking-wider mb-1">Custo Anual</label><span id="res-anual" class="text-2xl font-black">R$ 0,00</span></div>
        </div>

        <div class="card-simulador bg-white p-6 rounded-3xl border border-slate-200 shadow-sm mb-10">
            <h3 class="text-xs font-bold text-slate-900 uppercase tracking-wider mb-4 pb-2 border-b border-slate-100 flex items-center gap-2"><i class="fa-solid fa-magnifying-glass-chart text-blue-600"></i> Detalhamento Técnico (Mensal)</h3>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="p-4 bg-slate-50 rounded-2xl border border-slate-200"><span class="block text-[10px] font-bold text-slate-500 uppercase">Produção</span><div class="mt-1 flex items-baseline gap-1"><span id="res-total-imp" class="text-xl font-black text-slate-900">0</span> <span class="text-xs font-bold text-slate-500">imprs.</span></div></div>
                <div class="p-4 bg-blue-50/80 rounded-2xl border border-blue-200"><span class="block text-[10px] font-bold text-blue-700 uppercase">Tinta</span><div class="mt-1 flex items-baseline gap-1"><span id="res-tinta-ml" class="text-xl font-black text-blue-900">0</span> <span class="text-xs font-bold text-blue-700">ml</span></div><span class="block text-xs font-bold text-slate-600 mt-1">R$ <span id="res-tinta-rs">0,00</span></span></div>
                <div class="p-4 bg-indigo-50/80 rounded-2xl border border-indigo-200"><span class="block text-[10px] font-bold text-indigo-700 uppercase">Solvente</span><div class="mt-1 flex items-baseline gap-1"><span id="res-solvente-ml" class="text-xl font-black text-indigo-900">0</span> <span class="text-xs font-bold text-indigo-700">ml</span></div><span class="block text-xs font-bold text-slate-600 mt-1">R$ <span id="res-solvente-rs">0,00</span></span></div>
            </div>
        </div>
        
    </main>

    <!-- MOTOR CENTRAL DO SISTEMA (Puxa menu, login, etc) -->
    <script type="module" src="core.js"></script>

    <!-- LÓGICA DO MÓDULO SIMULADOR -->
    <script>
        // 1. INICIALIZAÇÃO DO MÓDULO
        window.initModule = function(perfil) {
            // Exibe a tela principal
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-content').classList.remove('hidden');

            // Preencher Consultor Automaticamente com o nome logado
            const fieldConsultor = document.getElementById('sim_consultor');
            if (fieldConsultor && !fieldConsultor.value) {
                fieldConsultor.value = window.nomeUsuarioLogado || (window.currentUser ? window.currentUser.email.split('@')[0].toUpperCase() : '');
            }

            // Dispara o cálculo inicial para a tela não ficar zerada
            window.calcularSimuladorOficial();
        };

        // 2. MATEMÁTICA DO SIMULADOR OFICIAL
        window.calcularSimuladorOficial = function() {
            const ptsMatriz = parseInt(document.getElementById('tipoMatriz').value) || 16;
            const chars = parseInt(document.getElementById('caracteres').value) || 0;
            const ptsExtra = parseInt(document.getElementById('extras').value) || 0;
            const impMin = parseInt(document.getElementById('imp_min').value) || 0;
            const dias = parseInt(document.getElementById('dias').value) || 1;
            const horas = parseInt(document.getElementById('horas').value) || 0;
            const temp = parseInt(document.getElementById('temperatura').value) || 20;
            const precoTinta = parseFloat(document.getElementById('precoTinta').value) || 0;
            const precoSolvente = parseFloat(document.getElementById('precoSolvente').value) || 0;

            const totalPontos = (ptsMatriz * chars) + ptsExtra;
            document.getElementById('display-pontos').innerText = `(Pts: ${totalPontos.toLocaleString('pt-BR')})`;

            const totalImpMes = impMin * 60 * horas * dias;
            document.getElementById('res-total-imp').innerText = totalImpMes.toLocaleString('pt-BR');

            const consumoTintaMl = ((totalPontos * totalImpMes) / 1280000000) * 750;
            const custoTinta = (consumoTintaMl / 750) * precoTinta;

            let mlPorHora = (temp <= 20) ? (2 + (temp - 10) * 0.2) : (4 + (temp - 20) * 0.4);
            const consumoSolventeMl = mlPorHora * (horas * dias);
            const custoSolvente = (consumoSolventeMl / 750) * precoSolvente;

            const custoTotalMensal = custoTinta + custoSolvente;
            const custoPorImpressao = totalImpMes > 0 ? (custoTotalMensal / totalImpMes) : 0;
            const custoDiario = custoTotalMensal / dias;
            const custoAnual = custoTotalMensal * 12;

            document.getElementById('res-tinta-ml').innerText = consumoTintaMl.toLocaleString('pt-BR', {minimumFractionDigits: 1, maximumFractionDigits: 1});
            document.getElementById('res-tinta-rs').innerText = custoTinta.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            document.getElementById('res-solvente-ml').innerText = consumoSolventeMl.toLocaleString('pt-BR', {minimumFractionDigits: 1, maximumFractionDigits: 1});
            document.getElementById('res-solvente-rs').innerText = custoSolvente.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            document.getElementById('res-unitario').innerText = "R$ " + custoPorImpressao.toLocaleString('pt-BR', {minimumFractionDigits: 4, maximumFractionDigits: 4});
            document.getElementById('res-diario').innerText = "R$ " + custoDiario.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            document.getElementById('res-mensal').innerText = "R$ " + custoTotalMensal.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            document.getElementById('res-anual').innerText = "R$ " + custoAnual.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        };
    </script>
</body>
</html>
